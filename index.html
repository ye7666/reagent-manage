<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>检验科试剂盘点管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 12px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }
        h2 {
            margin-bottom:14px;
            color:#222;
            font-size:20px;
        }
        .top-bar{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            align-items:center;
            margin-bottom:16px;
        }
        .search-wrap{
            display:flex;
            gap:8px;
            flex:1;
            min-width:260px;
        }
        #globalSearch{
            flex:1;
        }
        .btn-group{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }
        input,button,select{
            padding:8px 12px;
            font-size:15px;
            border:1px solid #cccccc;
            border-radius:6px;
        }
        button{
            cursor:pointer;
            background:#2563eb;
            color:#fff;
            border:none;
            touch-action: manipulation;
        }
        button:active{
            opacity:0.85;
        }
        .btn-danger{
            background-color:#dc2626;
        }
        table{
            width:100%;
            border-collapse: collapse;
            margin-top:10px;
        }
        th,td{
            border:1px solid #dddddd;
            padding:9px 6px;
            font-size:14px;
            text-align:center;
        }
        th{
            background-color:#eef4fc;
        }
        .form-row{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-bottom:10px;
        }
        .form-row input{
            flex:1;
            min-width:130px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>检验科试剂盘点管理</h2>

    <!--顶部搜索与操作栏 已修复搜索、月度导出按钮-->
    <div class="top-bar">
        <div class="search-wrap">
            <input id="globalSearch" placeholder="全局模糊搜索：名称/品牌/批号/位置/有效期">
            <button id="btnGlobalSearch">搜索</button>
        </div>
        <div class="btn-group">
            <button id="btnExportMonth">月度盘存导出Excel</button>
            <button id="btnExportAll">全部导出</button>
            <button id="btnImport">Excel导入</button>
            <button id="btnBatchDel" class="btn-danger">批量删除选中</button>
        </div>
    </div>

    <!--新增试剂表单-->
    <div class="form-row">
        <input id="inpName" placeholder="试剂名称">
        <input id="inpBrand" placeholder="品牌">
        <input id="inpBatch" placeholder="批号">
        <input id="inpStock" placeholder="库存数量" type="number">
        <input id="inpPos" placeholder="存放位置">
        <input id="inpExp" placeholder="有效期 yyyy‑mm‑dd">
        <button id="btnAdd">添加</button>
    </div>

    <table>
        <thead>
            <tr>
                <th><input type="checkbox" id="checkAll"></th>
                <th>试剂名称</th>
                <th>品牌</th>
                <th>批号</th>
                <th>库存数量</th>
                <th>存放位置</th>
                <th>有效期</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <input type="file" id="fileInput" style="display:none" accept=".xlsx,.xls">
</div>

<script>
//数据源
let reagentList = [];
//原始完整数据，用于搜索重置
let originData = [];

//DOM对象
const globalSearch = document.getElementById('globalSearch');
const btnGlobalSearch = document.getElementById('btnGlobalSearch');
const btnExportMonth = document.getElementById('btnExportMonth');
const btnExportAll = document.getElementById('btnExportAll');
const btnImport = document.getElementById('btnImport');
const btnBatchDel = document.getElementById('btnBatchDel');
const btnAdd = document.getElementById('btnAdd');
const checkAll = document.getElementById('checkAll');
const tableBody = document.getElementById('tableBody');
const fileInput = document.getElementById('fileInput');

//输入框
const inpName = document.getElementById('inpName');
const inpBrand = document.getElementById('inpBrand');
const inpBatch = document.getElementById('inpBatch');
const inpStock = document.getElementById('inpStock');
const inpPos = document.getElementById('inpPos');
const inpExp = document.getElementById('inpExp');


//====================【已修复：全局模糊搜索】====================
function doGlobalSearch(){
    const keyword = globalSearch.value.trim().toLowerCase();
    if(!keyword){
        reagentList = JSON.parse(JSON.stringify(originData));
        renderTable();
        return;
    }
    reagentList = originData.filter(item=>{
        return Object.values(item).some(val=> String(val).toLowerCase().includes(keyword))
    })
    renderTable();
}
//按钮点击事件 兼容iOS Safari
btnGlobalSearch.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    doGlobalSearch();
})
//回车搜索
globalSearch.addEventListener('keydown',e=>{
    if(e.key === 'Enter'){
        doGlobalSearch();
    }
})

//====================【已修复：月度盘存导出BUG】====================
function exportMonthInventory(){
    if(reagentList.length === 0){
        alert("暂无盘点数据，不能导出");
        return;
    }
    const header = ["试剂名称","品牌","批号","库存数量","存放位置","有效期"];
    const sheetArr = [header];
    reagentList.forEach(r=>{
        sheetArr.push([r.name,r.brand,r.batch,r.stock,r.pos,r.exp])
    })
    const ws = XLSX.utils.aoa_to_sheet(sheetArr);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"月度盘点");
    XLSX.writeFile(wb,"试剂月度盘点.xlsx");
}
btnExportMonth.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    exportMonthInventory();
})

//全部导出
function exportAllData(){
    if(originData.length ===0){
        alert("暂无全部数据");
        return;
    }
    const header = ["试剂名称","品牌","批号","库存数量","存放位置","有效期"];
    const sheetArr = [header];
    originData.forEach(r=>{
        sheetArr.push([r.name,r.brand,r.batch,r.stock,r.pos,r.exp])
    })
    const ws = XLSX.utils.aoa_to_sheet(sheetArr);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"全部试剂");
    XLSX.writeFile(wb,"全部试剂清单.xlsx");
}
btnExportAll.addEventListener('click',e=>{
    e.stopPropagation();
    exportAllData();
})

//添加试剂
function addItem(){
    const name = inpName.value.trim();
    const brand = inpBrand.value.trim();
    const batch = inpBatch.value.trim();
    const stock = Number(inpStock.value);
    const pos = inpPos.value.trim();
    const exp = inpExp.value.trim();
    if(!name||!batch||isNaN(stock)){
        alert("必填项不能为空，库存必须是数字");
        return;
    }
    const newRow = {id:Date.now(),name,brand,batch,stock,pos,exp,checked:false};
    originData.push(newRow);
    reagentList = JSON.parse(JSON.stringify(originData));
    renderTable();
    //清空输入框
    inpName.value="";inpBrand.value="";inpBatch.value="";
    inpStock.value="";inpPos.value="";inpExp.value="";
}
btnAdd.addEventListener('click',e=>{
    e.stopPropagation();
    addItem();
})

//渲染表格
function renderTable(){
    tableBody.innerHTML = "";
    reagentList.forEach(item=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td><input type="checkbox" data-id="${item.id}" ${item.checked?"checked":""} class="row-check"></td>
        <td>${item.name}</td>
        <td>${item.brand}</td>
        <td>${item.batch}</td>
        <td>${item.stock}</td>
        <td>${item.pos}</td>
        <td>${item.exp}</td>
        <td><button class="del-one" data-id="${item.id}" style="background:#dc2626">删除</button></td>
        `;
        tableBody.appendChild(tr);
    })
    bindRowEvents();
}

//单行删除、行复选框
function bindRowEvents(){
    //单行删除
    document.querySelectorAll('.del-one').forEach(btn=>{
        btn.addEventListener('click',e=>{
            const delId = Number(e.target.dataset.id);
            originData = originData.filter(x=>x.id!==delId);
            reagentList = JSON.parse(JSON.stringify(originData));
            renderTable();
        })
    })
    //行勾选
    document.querySelectorAll('.row-check').forEach(ck=>{
        ck.addEventListener('change',e=>{
            const rid = Number(e.target.dataset.id);
            const find = reagentList.find(x=>x.id===rid);
            if(find) find.checked = e.target.checked;
        })
    })
}

//全选
checkAll.addEventListener('change',e=>{
    const isChecked = e.target.checked;
    reagentList.forEach(i=>i.checked = isChecked);
    renderTable();
})

//批量删除
btnBatchDel.addEventListener('click',e=>{
    e.stopPropagation();
    const selectedIds = reagentList.filter(x=>x.checked).map(x=>x.id);
    if(selectedIds.length ===0){
        alert("请先勾选要删除的数据");
        return;
    }
    if(!confirm(`确认删除选中${selectedIds.length}条记录？`))return;
    originData = originData.filter(x=>!selectedIds.includes(x.id));
    reagentList = JSON.parse(JSON.stringify(originData));
    renderTable();
})

//导入
btnImport.addEventListener('click',e=>{
    e.stopPropagation();
    fileInput.click();
})
fileInput.addEventListener('change',e=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        const data = new Uint8Array(ev.target.result);
        const workbook = XLSX.read(data,{type:'array'});
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet);
        json.forEach(row=>{
            const newItem = {
                id:Date.now()+Math.random(),
                name:row["试剂名称"]||"",
                brand:row["品牌"]||"",
                batch:row["批号"]||"",
                stock:Number(row["库存数量"]||0),
                pos:row["存放位置"]||"",
                exp:row["有效期"]||"",
                checked:false
            }
            originData.push(newItem);
        })
        reagentList = JSON.parse(JSON.stringify(originData));
        renderTable();
        fileInput.value = "";
        alert("导入成功");
    }
    reader.readAsArrayBuffer(f);
})

//初始化
renderTable();
</script>
</body>
</html>
