<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="MANIFEST.webmanifest">
<title>检验科试剂盘点管理系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft Yahei,sans-serif}
body{padding:12px;background:#f5f7fa;color:#222;max-width:1200px;margin:0 auto}
.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 16px;background:#e4eaf4;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.tab.active{background:#2b6cb0;color:#fff}
.panel{display:none}
.panel.show{display:block}
.card{background:#fff;padding:16px;border-radius:10px;margin-bottom:14px;box-shadow:0 1px 3px #00000018}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.form-item{display:flex;flex-direction:column;min-width:180px;flex:1}
label{font-size:13px;margin:4px 0}
input,select,textarea{padding:9px 10px;border:1px solid #cbd5e0;border-radius:6px;font-size:14px}
textarea{min-height:70px}
.btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:13px;margin:2px}
.btn-primary{background:#2b6cb0;color:#fff}
.btn-warn{background:#dd6b20;color:#fff}
.btn-danger{background:#c53030;color:#fff}
.btn-success{background:#2f855a;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#edf2f7}
.warn{color:#c53030;font-weight:bold}
.done{color:#2f855a;font-weight:bold}
small{color:#666;font-size:12px}
.file-input-wrap{margin:8px 0}
</style>
</head>
<body>
<h2>检验科试剂盘点管理系统</h2>
<small>IndexedDB本地存储｜生化试剂批号比对标记：已比对/未比对｜月度盘存CSV导出｜json备份恢复</small>

<div class="tab-bar">
<button class="tab active" data-tab="stock">库存管理</button>
<button class="tab" data-tab="reagentlib">试剂档案</button>
<button class="tab" data-tab="compare">生化试剂比对</button>
<button class="tab" data-tab="scan">扫码盘点</button>
<button class="tab" data-tab="export">备份导入&盘存导出</button>
</div>

<!--库存管理面板-->
<div id="stock" class="panel show">
<div class="card">
<h3>新增/编辑试剂库存</h3>
<div class="row">
<div class="form-item">
<label>试剂名称（可自定义输入）</label>
<input list="reagentNameList" id="stockName" placeholder="输入或选择试剂">
<datalist id="reagentNameList"></datalist>
</div>
<div class="form-item">
<label>试剂分类（可自定义）</label>
<input list="cateList" id="stockCate" placeholder="输入或选择分类">
<datalist id="cateList"></datalist>
</div>
<div class="form-item">
<label>规格</label>
<input id="stockSpec" placeholder="例如 50ml">
</div>
<div class="form-item">
<label>包装说明</label>
<input id="stockPackage" placeholder="填写包装说明">
</div>
</div>
<div class="row">
<div class="form-item">
<label>批号</label>
<input id="stockBatch">
</div>
<div class="form-item">
<label>有效期</label>
<input type="date" id="stockExp">
</div>
<div class="form-item">
<label>库存数量</label>
<input type="number" id="stockNum" value="1">
</div>
<div class="form-item">
<label>供应商</label>
<input id="stockSup">
</div>
</div>
<div class="row">
<div class="form-item" style="flex:1 1 100%">
<label>备注</label>
<textarea id="stockRemark"></textarea>
</div>
</div>
<div class="row">
<button class="btn btn-primary" onclick="saveStock()">保存库存记录</button>
<button class="btn" onclick="clearStockForm()">清空表单</button>
</div>
</div>

<div class="card">
<h3>库存列表 <small>红色=临近过期(≤30天)｜绿色=已比对</small></h3>
<div id="stockTableWrap"></div>
</div>
</div>

<!--生化试剂比对面板-->
<div id="compare" class="panel">
<div class="card">
<h3>生化试剂批号比对管理</h3>
<div class="row">
<div class="form-item">
<label>筛选</label>
<select id="compareFilter" onchange="renderCompareTable()">
<option value="all">全部生化试剂</option>
<option value="no">仅显示【未比对】</option>
<option value="yes">仅显示【已比对】</option>
</select>
</div>
</div>
<button class="btn btn-primary" onclick="renderCompareTable()">刷新列表</button>
<button class="btn" onclick="exportCompareCsv()">导出比对列表CSV</button>
<div id="compareWrap"></div>
</div>
</div>

<!--试剂档案面板-->
<div id="reagentlib" class="panel">
<div class="card">
<h3>试剂档案库（自定义试剂/分类）</h3>
<p>在这里维护常用试剂名称、分类，新增库存时下拉可直接选用</p>
<div class="row">
<div class="form-item">
<label>新增试剂名称</label>
<input id="libName">
</div>
<div class="form-item">
<label>新增试剂分类</label>
<input id="libCate">
</div>
</div>
<div class="row">
<button class="btn btn-primary" onclick="addReagentLib()">添加试剂档案</button>
<button class="btn" onclick="addCateLib()">新增分类</button>
</div>
<div id="libTableWrap"></div>
</div>
</div>

<!--扫码盘点面板-->
<div id="scan" class="panel">
<div class="card">
<h3>摄像头扫码盘点</h3>
<div><video id="video" style="max-width:100%;border:1px solid #aaa"></video></div>
<p id="scanTip">点击开启摄像头</p>
<button class="btn btn-primary" onclick="startScan()">开启扫码</button>
<button class="btn btn-danger" onclick="stopScan()">关闭摄像头</button>
<div class="row">
<div class="form-item">
<label>扫码识别结果</label>
<input id="scanResult" readonly>
</div>
<div class="form-item">
<label>本次盘点数量</label>
<input type="number" id="scanCount" value="1">
</div>
</div>
<button class="btn btn-primary" onclick="saveScanRecord()">保存盘点记录</button>
</div>
</div>

<!--备份导入&盘存导出面板-->
<div id="export" class="panel">
<div class="card">
<h3>月度盘存导出 & 系统备份导入</h3>
<p>【月度盘存导出CSV】每月盘点使用，下载后直接用Excel打开、打印、做账（包含比对状态列）</p>
<button class="btn btn-primary" onclick="exportInventoryCsv()">📅 月度盘存导出CSV</button>

<p style="margin-top:12px">【系统备份JSON】用于软件数据恢复，不要直接打开编辑</p>
<button class="btn btn-primary" onclick="exportData()">导出全部数据备份(json)</button>

<div class="file-input-wrap">
<label>导入备份json文件（恢复数据）</label>
<input type="file" id="importFile" accept=".json">
<button class="btn btn-warn" onclick="importData()">执行导入</button>
</div>
</div>
</div>

<script>
const DB_NAME="ReagentDB";
const DB_VERSION=1;
let db=null;
const stores={
stock:"stock",
reagentLib:"reagentLib",
cateLib:"cateLib"
}

function openDB(){
return new Promise((res,rej)=>{
const req=indexedDB.open(DB_NAME,DB_VERSION);
req.onupgradeneeded=e=>{
db=e.target.result;
if(!db.objectStoreNames.contains(stores.stock))db.createObjectStore(stores.stock,{keyPath:"id",autoIncrement:true});
if(!db.objectStoreNames.contains(stores.reagentLib))db.createObjectStore(stores.reagentLib,{keyPath:"id",autoIncrement:true});
if(!db.objectStoreNames.contains(stores.cateLib))db.createObjectStore(stores.cateLib,{keyPath:"id",autoIncrement:true});
}
req.onsuccess=e=>{db=e.target.result;res(db)}
req.onerror=e=>rej(e.target.error)
})
}

async function initDB(){await openDB();await renderAll()}

async function getAll(storeName){
return new Promise(res=>{
const tx=db.transaction(storeName,"readonly");
const st=tx.objectStore(storeName);
const arr=[];
st.openCursor().onsuccess=e=>{
const cur=e.target.result;
if(cur){arr.push(cur.value);cur.continue()}else res(arr)
}
})
}
async function add(storeName,obj){
return new Promise((res)=>{
const tx=db.transaction(storeName,"readwrite");
tx.objectStore(storeName).add(obj).onsuccess=e=>res(e.target.result)
})
}
async function put(storeName,obj){
return new Promise(res=>{
const tx=db.transaction(storeName,"readwrite");
tx.objectStore(storeName).put(obj).onsuccess=e=>res(e.target.result)
})
}
async function del(storeName,id){
return new Promise(res=>{
const tx=db.transaction(storeName,"readwrite");
tx.objectStore(storeName).delete(id).onsuccess=e=>res()
})
}

document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));
t.classList.add("active");
document.getElementById(t.dataset.tab).classList.add("show")
if(t.dataset.tab==="compare") renderCompareTable();
}
})

async function renderAll(){
await renderStock();
await renderLib();
await fillDatalist();
}

async function fillDatalist(){
const nameList=await getAll(stores.reagentLib);
const cateList=await getAll(stores.cateLib);
const nameDom=document.getElementById("reagentNameList");
const cateDom=document.getElementById("cateList");
nameDom.innerHTML="";cateDom.innerHTML="";
nameList.forEach(n=>{const opt=document.createElement("option");opt.value=n.name;nameDom.appendChild(opt)})
cateList.forEach(c=>{const opt=document.createElement("option");opt.value=c.name;cateDom.appendChild(opt)})
}

async function saveStock(){
const name=document.getElementById("stockName").value.trim();
const cate=document.getElementById("stockCate").value.trim();
const spec=document.getElementById("stockSpec").value.trim();
const pack=document.getElementById("stockPackage").value.trim();
const batch=document.getElementById("stockBatch").value.trim();
const exp=document.getElementById("stockExp").value;
const num=Number(document.getElementById("stockNum").value||0);
const sup=document.getElementById("stockSup").value.trim();
const remark=document.getElementById("stockRemark").value.trim();
if(!name){alert("试剂名称不能为空");return}
const allNames=await getAll(stores.reagentLib);
const allCates=await getAll(stores.cateLib);
if(!allNames.find(x=>x.name===name)) await add(stores.reagentLib,{name});
if(!allCates.find(x=>x.name===cate)) await add(stores.cateLib,{name});
//新建默认：未比对
await add(stores.stock,{name,cate,spec,packageDesc:pack,batch,exp,num,sup,remark,compareStatus:"未比对",createTime:new Date().toISOString()});
clearStockForm();
await renderAll();
alert("保存成功")
}
function clearStockForm(){
document.getElementById("stockName").value="";
document.getElementById("stockCate").value="";
document.getElementById("stockSpec").value="";
document.getElementById("stockPackage").value="";
document.getElementById("stockBatch").value="";
document.getElementById("stockExp").value="";
document.getElementById("stockNum").value=1;
document.getElementById("stockSup").value="";
document.getElementById("stockRemark").value="";
}

async function toggleCompareStatus(id){
const all=await getAll(stores.stock);
const item=all.find(d=>d.id===id);
if(!item)return;
item.compareStatus=item.compareStatus==="已比对"?"未比对":"已比对";
await put(stores.stock,item);
await renderAll();
}

async function renderStock(){
const list=await getAll(stores.stock);
const wrap=document.getElementById("stockTableWrap");
if(!list.length){wrap.innerHTML="<p>暂无库存数据</p>";return}
let html=`<table><tr><th>试剂名称</th><th>分类</th><th>规格</th><th>包装说明</th><th>批号</th><th>有效期</th><th>数量</th><th>供应商</th><th>比对状态</th><th>备注</th><th>操作</th></tr>`;
const now=new Date();
list.forEach(item=>{
let cls="";
if(item.exp){
const expD=new Date(item.exp);
const diff=(expD.getTime()-now.getTime())/(1000*3600*24);
if(diff<=30)cls="warn";
}
let statusCls=item.compareStatus==="已比对"?"done":"";
html+=`<tr class="${cls}">
<td>${item.name||""}</td>
<td>${item.cate||""}</td>
<td>${item.spec||""}</td>
<td>${item.packageDesc||""}</td>
<td>${item.batch||""}</td>
<td>${item.exp||""}</td>
<td>${item.num}</td>
<td>${item.sup||""}</td>
<td class="${statusCls}">${item.compareStatus||"未比对"}</td>
<td>${item.remark||""}</td>
<td>
<button class="btn btn-success" onclick="toggleCompareStatus(${item.id})">切换比对</button>
<button class="btn btn-danger" onclick="delStock(${item.id})">删除</button>
</td>
</tr>`
})
html+="</table>";
wrap.innerHTML=html;
}
window.delStock=async function(id){if(!confirm("确定删除？"))return;await del(stores.stock,id);await renderAll()}
window.toggleCompareStatus=toggleCompareStatus;

//====生化试剂比对页面，只筛选分类包含生化的记录====
async function renderCompareTable(){
const filter=document.getElementById("compareFilter").value;
const all=await getAll(stores.stock);
//筛选：分类含有“生化”
let list=all.filter(r=> (r.cate||"").includes("生化"));
if(filter==="yes") list=list.filter(x=>x.compareStatus==="已比对");
if(filter==="no") list=list.filter(x=>x.compareStatus==="未比对");
const wrap=document.getElementById("compareWrap");
if(!list.length){wrap.innerHTML="<p>暂无生化试剂数据</p>";return;}
let html=`<table><tr><th>试剂名称</th><th>分类</th><th>批号</th><th>有效期</th><th>数量</th><th>比对状态</th><th>操作</th></tr>`;
list.forEach(item=>{
let statusCls=item.compareStatus==="已比对"?"done":"";
html+=`<tr>
<td>${item.name||""}</td>
<td>${item.cate||""}</td>
<td>${item.batch||""}</td>
<td>${item.exp||""}</td>
<td>${item.num}</td>
<td class="${statusCls}">${item.compareStatus}</td>
<td><button class="btn btn-success" onclick="toggleCompareStatus(${item.id})">切换比对状态</button></td>
</tr>`
})
html+="</table>";
wrap.innerHTML=html;
}

async function exportCompareCsv(){
const filter=document.getElementById("compareFilter").value;
const all=await getAll(stores.stock);
let list=all.filter(r=> (r.cate||"").includes("生化"));
if(filter==="yes") list=list.filter(x=>x.compareStatus==="已比对");
if(filter==="no") list=list.filter(x=>x.compareStatus==="未比对");
const header=["试剂名称","分类","批号","有效期","库存数量","比对状态"];
const lines=[];
lines.push(header.join(","));
list.forEach(item=>{
const row=[
`"${(item.name||"").replace(/"/g,'""')}"`,
`"${(item.cate||"").replace(/"/g,'""')}"`,
`"${(item.batch||"").replace(/"/g,'""')}"`,
`"${item.exp||""}"`,
item.num,
`"${item.compareStatus||"未比对"}"`
];
lines.push(row.join(","));
})
const csvText="\uFEFF"+lines.join("\n");
const blob=new Blob([csvText],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
const now=new Date();
const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,"0"),d=String(now.getDate()).padStart(2,"0");
a.href=URL.createObjectURL(blob);
a.download=`生化试剂比对_${y}年${m}月${d}日.csv`;
a.click();
URL.revokeObjectURL(a.href);
}

async function addReagentLib(){
const n=document.getElementById("libName").value.trim();
if(!n)return alert("输入试剂名称");
await add(stores.reagentLib,{name:n});
document.getElementById("libName").value="";
await renderAll();
}
async function addCateLib(){
const c=document.getElementById("libCate").value.trim();
if(!c)return alert("输入分类名称");
await add(stores.cateLib,{name:c});
document.getElementById("libCate").value="";
await renderAll();
}
async function renderLib(){
const names=await getAll(stores.reagentLib);
const cates=await getAll(stores.cateLib);
const wrap=document.getElementById("libTableWrap");
let html="<div class='row'><div style='flex:1'><h4>已保存试剂名称</h4><ul>";
names.forEach(x=>html+=`<li>${x.name} <button onclick='delLibItem("reagentLib",${x.id})'>删除</button></li>`);
html+="</ul></div><div style='flex:1'><h4>已保存分类</h4><ul>";
cates.forEach(x=>html+=`<li>${x.name} <button onclick='delLibItem("cateLib",${x.id})'>删除</button></li>`);
html+="</ul></div></div>";
wrap.innerHTML=html;
}
window.delLibItem=async function(store,id){
if(!confirm("删除？"))return;await del(store,id);await renderAll();
}

let mediaStream=null;
async function startScan(){
try{
const video=document.getElementById("video");
mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
video.srcObject=mediaStream;
document.getElementById("scanTip").innerText="摄像头已开启";
}catch(e){alert("无法打开摄像头："+e.message)}
}
function stopScan(){
if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
document.getElementById("scanTip").innerText="摄像头已关闭";
}
function saveScanRecord(){
const res=document.getElementById("scanResult").value;
const cnt=Number(document.getElementById("scanCount").value);
alert(`盘点条码:${res},数量${cnt}，如需入库复制到库存表单`);
}

async function exportInventoryCsv(){
const list=await getAll(stores.stock);
const header=["试剂名称","分类","规格","包装说明","批号","有效期","库存数量","供应商","比对状态","备注"];
const lines=[];
lines.push(header.join(","));
list.forEach(item=>{
const row=[
`"${(item.name||"").replace(/"/g,'""')}"`,
`"${(item.cate||"").replace(/"/g,'""')}"`,
`"${(item.spec||"").replace(/"/g,'""')}"`,
`"${(item.packageDesc||"").replace(/"/g,'""')}"`,
`"${(item.batch||"").replace(/"/g,'""')}"`,
`"${item.exp||""}"`,
item.num,
`"${(item.sup||"").replace(/"/g,'""')}"`,
`"${item.compareStatus||"未比对"}"`,
`"${(item.remark||"").replace(/"/g,'""')}"`
];
lines.push(row.join(","));
})
const csvText="\uFEFF"+lines.join("\n");
const blob=new Blob([csvText],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
const now=new Date();
const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,"0"),d=String(now.getDate()).padStart(2,"0");
a.href=URL.createObjectURL(blob);
a.download=`试剂月度盘存_${y}年${m}月${d}日.csv`;
a.click();
URL.revokeObjectURL(a.href);
}

async function exportData(){
const stock=await getAll(stores.stock);
const rlib=await getAll(stores.reagentLib);
const clib=await getAll(stores.cateLib);
const data={stock,reagentLib:rlib,cateLib:clib,exportAt:new Date().toISOString()};
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="试剂管理系统完整备份.json";
a.click();
URL.revokeObjectURL(a.href);
}

async function importData(){
const file=document.getElementById("importFile").files[0];
if(!file)return alert("请选择备份json文件");
const text=await file.text();
const json=JSON.parse(text);
const tx=db.transaction([stores.stock,stores.reagentLib,stores.cateLib],"readwrite");
tx.objectStore(stores.stock).clear();
tx.objectStore(stores.reagentLib).clear();
tx.objectStore(stores.cateLib).clear();
await new Promise(res=>tx.oncomplete=res);
for(const s of json.stock) await add(stores.stock,s);
for(const r of json.reagentLib) await add(stores.reagentLib,r);
for(const c of json.cateLib) await add(stores.cateLib,c);
await renderAll();
alert("导入完成");
}

window.onload=async()=>{
await initDB();
}
</script>
</body>
</html>
